spring:
  application:
    name: kafka-batch-message-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://issuer.example.invalid}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://issuer.example.invalid/.well-known/jwks.json}

app:
  kafka:
    topic: ${KAFKA_TOPIC:events}
    ack-timeout: ${KAFKA_ACK_TIMEOUT:10s}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

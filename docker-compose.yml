services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: messages
      POSTGRES_USER: message_service
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local_dev_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U message_service -d messages"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: message-service:local
    environment:
      SERVER_PORT: 8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: events
      KAFKA_CONSUMER_GROUP_ID: message-service
      KAFKA_BATCH_SIZE: 100
      KAFKA_ACK_TIMEOUT: 10s
      KAFKA_DEAD_LETTER_TOPIC: events.dlq
      KAFKA_PROCESSING_RETRY_MAX_ATTEMPTS: 3
      KAFKA_PROCESSING_RETRY_BACKOFF: 250ms
      DATABASE_URL: jdbc:postgresql://postgres:5432/messages
      DATABASE_USERNAME: message_service
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local_dev_only}
      PROCESSED_MESSAGE_RETENTION_PERIOD: 30d
      PROCESSED_MESSAGE_RETENTION_CLEANUP_INTERVAL: 1h
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://issuer.example.invalid}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-https://issuer.example.invalid/.well-known/jwks.json}
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
